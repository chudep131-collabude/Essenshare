# EssenShare — Production Nginx Configuration
# Copy to /etc/nginx/sites-available/essenshare and enable with:
#   ln -s /etc/nginx/sites-available/essenshare /etc/nginx/sites-enabled/essenshare
#   sudo nginx -t && sudo systemctl reload nginx

# Rate limiting zone — 10MB shared memory, 30 requests/minute per IP
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

# Privacy-safe log format (no query strings that may contain coordinates)
log_format privacy '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent';

# Gzip compression
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name essenshare.org www.essenshare.org;

    return 301 https://$host$request_uri;
}

# HTTPS — main server block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name essenshare.org www.essenshare.org;

    # SSL/TLS certificates (replace with real paths after provisioning)
    ssl_certificate     /etc/ssl/certs/essenshare.org.crt;
    ssl_certificate_key /etc/ssl/private/essenshare.org.key;

    # TLS protocol versions: 1.2 minimum, 1.3 preferred
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Privacy-safe access log
    access_log /var/log/nginx/essenshare.access.log privacy;
    error_log  /var/log/nginx/essenshare.error.log warn;

    # API — proxy to Express backend with rate limiting
    location /api/ {
        limit_req zone=api burst=10 nodelay;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout  30s;
        proxy_connect_timeout 5s;
    }

    # Next.js static assets — served directly from the build output
    location /_next/static/ {
        alias /var/www/essenshare/frontend/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # All other routes — proxy to Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout  60s;
        proxy_connect_timeout 5s;
    }
}
