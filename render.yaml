# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint Specification (Infrastructure-as-Code)
# Documentation: https://render.com/docs/blueprint-spec
# ─────────────────────────────────────────────────────────────────────────────
services:
  # ── Backend Web Service (Express.js API) ──────────────────────────────────
  - type: web
    name: essenshare-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --omit=dev && npm run db:migrate
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: info
      # Automatically wire connection string from the managed Render PostgreSQL below
      - key: DATABASE_URL
        fromDatabase:
          name: essenshare-db
          property: connectionString
      # Securely auto-generate secrets for JWT on initial provision
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      # Set APP_URL to your Vercel frontend URL (e.g. https://essenshare.vercel.app)
      - key: APP_URL
        sync: false
      # Optional: extra domains allowed for CORS (comma-separated)
      - key: CORS_ORIGIN
        sync: false

# ── Managed PostgreSQL Database on Render (Free Tier) ────────────────────────
databases:
  - name: essenshare-db
    databaseName: surplus_prod
    user: surplus_admin
    plan: free
    region: frankfurt
